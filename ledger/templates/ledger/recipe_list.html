{% extends 'base.html'%}
{% block title %}All Recipes{% endblock %}

{% block content %}
    <h2>Recipe List</h2>
    <ul>
        {% for recipe in recipes %}
            <li>
                <a href="/recipe/{{ forloop.counter }}">{{ recipe.name }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}

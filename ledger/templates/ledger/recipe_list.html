{% extends "base.html" %}

{% block page_heading %}Recipe List{% endblock %}

{% block content %}
    <p>recipes:</p>
    {% for recipe in recipes %}
    <div style="padding-left: 20px;">
        name: <a href="{{ recipe.get_absolute_url }}">{{ recipe.name}}</a><br>
        </div>
        {% endfor %}
    
    <p><a href="{% url 'recipe_add' %}">Add Recipe</a></p>
{% endblock %}

{% extends "base.html" %}

{% block content %}
    <p>name: {{ recipe.name }}</p>

    <p>ingredients:</p>
    {% for item in recipe.ingredients %}
        <p>
            name: {{ item.name }}<br>
            quantity: {{ item.quantity }}
        </p>
    {% endfor %}

    <p>link: <a href="{{ recipe.link }}">{{ recipe.link }}</a></p>
{% endblock %}

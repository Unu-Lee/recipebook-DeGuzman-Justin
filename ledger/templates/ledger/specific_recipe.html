{% extends "base.html" %}

{% block content %}
    <p>name: {{ recipe.name }}</p>

    <p>ingredients:</p>
        {% for item in recipe.ingredients %}
            <ul><li>
                name: {{ item.name }}, <br>
                quantity: {{ item.quantity }}
            </ul></li>
        {% endfor %}

    <p>link: <a href="{{ recipe.link }}">{{ recipe.link }}</a></p>
{% endblock %}

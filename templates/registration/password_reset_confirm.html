{% extends "base.html" %}

{% block page_heading %}Set New Password{% endblock %}

{% block content %}
{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Change Password">
    </form>
{% else %}
    <p>Invalid reset link.</p>
{% endif %}
{% endblock %}

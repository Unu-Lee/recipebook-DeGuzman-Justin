<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Recipe Book{% endblock %}</title>
</head>
<body>  
    <header>
        <h1>Recipe Book</h1>
        {% if user.is_authentiicated %}
            <form method="post" action="{url 'logout'}">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </header>

    {% block content %}{% endblock %}
</body>
</html>
